<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1769e8"><title>基金工作台</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#1b2940;font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:560px;margin:auto;padding-bottom:78px}.top{background:#1769e8;color:white;padding:20px;position:sticky;top:0}.top h1{margin:8px 0}.main{padding:14px}.card{background:#fff;border-radius:18px;padding:17px;margin-bottom:13px}.hero{background:linear-gradient(135deg,#1769e8,#398aff);color:white;border-radius:20px;padding:20px}.big{font-size:30px;font-weight:bold;margin:10px 0}.row{display:flex;justify-content:space-between;align-items:center;gap:8px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:15px}.stat{background:#ffffff25;border-radius:12px;padding:10px}.stat b{display:block;margin-top:4px}.muted{font-size:12px;color:#8290a4}.hero .muted{color:#e2efff}.btn{border:0;border-radius:10px;background:#1769e8;color:#fff;padding:10px 13px}.soft{background:#edf4ff;color:#1769e8}.item{padding:13px 0;border-bottom:1px solid #e9edf3}.gain{font-size:12px;color:#e34e5c;margin-top:5px}.notice{background:#fff8e8;color:#795a20;border-radius:12px;padding:12px;font-size:12px;line-height:1.5}.field{margin:10px 0}.field label{display:block;font-size:12px;color:#8190a3}.field input,.field select{width:100%;padding:11px;border:1px solid #dfe6ef;border-radius:10px;font:inherit}.tabs{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e5eaf1;display:flex;justify-content:space-around;padding:10px 0 calc(10px + env(safe-area-inset-bottom))}.tab{border:0;background:none;color:#8793a3;font-size:11px}.tab.on{color:#1769e8}.empty{text-align:center;color:#8793a3;padding:18px}.metric{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #e9edf3}</style><body><div class="app"><header class="top"><small>◷ 本机工作台 · 仅本机保存</small><h1 id="title">总览</h1><small id="date"></small></header><main id="main" class="main"></main><nav class="tabs"><button class="tab on" data-page="总览">⌂<br>总览</button><button class="tab" data-page="持仓">▤<br>持仓</button><button class="tab" data-page="定投">↻<br>定投</button><button class="tab" data-page="分析">◷<br>分析</button><button class="tab" data-page="数据">⚙<br>数据</button></nav></div><script>
const K="fund-workbench-v1";let d=JSON.parse(localStorage.getItem(K)||'{"funds":[],"plans":[]}'),p="总览";const save=()=>localStorage.setItem(K,JSON.stringify(d)),num=x=>Number(x||0),fmt=x=>num(x).toLocaleString("zh-CN",{minimumFractionDigits:2,maximumFractionDigits:2}),sum=k=>d.funds.reduce((a,f)=>a+num(f[k]),0),esc=x=>String(x||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));document.getElementById("date").textContent=new Date().toLocaleDateString("zh-CN");
function rows(){return d.funds.length?d.funds.map(f=>'<div class="item"><div class="row"><div><b>'+esc(f.name)+'</b><div class="muted">'+esc(f.code)+' · '+esc(f.date)+'</div></div><b>¥'+fmt(f.value)+'</b></div><div class="row"><span class="gain">今日 '+(num(f.day)<0?"−":"+")+"¥"+fmt(Math.abs(num(f.day)))+'</span><span class="gain">持有 '+(num(f.pnl)<0?"−":"+")+"¥"+fmt(Math.abs(num(f.pnl)))+'</span></div></div>').join(""):'<div class="empty">还没有基金，点击添加持仓开始记录。</div>'}
function draw(){document.getElementById("title").textContent=p;document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("on",b.dataset.page===p));let m=document.getElementById("main");if(p==="总览")m.innerHTML='<section class="hero"><div class="muted">基金总资产 · 最近录入</div><div class="big">¥'+fmt(sum("value"))+'</div><div class="muted">持有收益 '+(sum("pnl")<0?"−":"+")+"¥"+fmt(Math.abs(sum("pnl")))+'</div><div class="grid"><div class="stat">今日收益<b>'+(sum("day")<0?"−":"+")+"¥"+fmt(Math.abs(sum("day")))+'</b></div><div class="stat">进行中定投<b>'+d.plans.filter(x=>x.active).length+' 个</b></div></div></section><section class="card"><div class="row"><b>我的持仓</b><button class="btn soft" data-go="持仓">管理</button></div>'+rows()+'</section><div class="notice">收益来自手动录入或截图核对，不是实时行情。请留意数据日期。</div>';
if(p==="持仓")m.innerHTML='<section class="card"><div class="row"><b>基金持仓</b><button class="btn" data-act="fund">＋ 添加</button></div><div class="item"><button class="btn soft" data-act="ocr">截图识别</button><small class="muted">识别功能尚未接入，当前请手动录入</small></div>'+rows()+'</section>';
if(p==="定投")m.innerHTML='<section class="card"><div class="row"><b>逐只设置定投</b><button class="btn" data-act="plan">＋ 新建</button></div>'+(d.plans.length?d.plans.map((x,i)=>'<div class="item"><div class="row"><b>'+esc(x.fund)+'</b><b>¥'+fmt(x.amount)+'</b></div><div class="muted">'+esc(x.freq)+' · '+esc(x.when)+' · '+esc(x.dividend)+'</div><button class="btn soft" data-toggle="'+i+'">'+(x.active?"暂停":"继续")+'</button></div>').join(""):'<div class="empty">定投由你手动为每只基金设置，不会从截图自动创建。</div>')+'</section><div class="notice">默认红利再投资。定投只作记录，不会替你下单。</div>';
if(p==="分析")m.innerHTML='<section class="card"><b>收益与风险</b><div class="metric"><span>持有收益</span><b>¥'+fmt(sum("pnl"))+'</b></div><div class="metric"><span>最大回撤</span><b>需历史净值</b></div><div class="metric"><span>回测与风险指标</span><b>待补数据</b></div></section><section class="card"><b>未来资产情景区间</b><svg width="100%" height="135" viewBox="0 0 340 135"><path d="M10 116 C75 105 105 85 155 82 S255 51 330 22 L330 102 C250 109 205 114 155 121 S60 128 10 131Z" fill="#dceaff"/><path d="M10 123 C75 115 105 101 155 99 S255 78 330 56" fill="none" stroke="#2677ed" stroke-width="3"/><text x="12" y="16" font-size="10" fill="#75849a">示意图 · 非个人预测</text></svg><small class="muted">真实预测需足够历史净值；当前不展示虚构结果。</small></section><div class="notice">QDII 请记录净值日期。回测需要可信净值、分红与交易流水。</div>';
if(p==="数据")m.innerHTML='<section class="card"><b>本机备份与恢复</b><p class="muted">数据仅保存在此设备浏览器。请导出 JSON 并另存；清理浏览器数据可能删除记录。</p><button class="btn" data-act="export">导出完整数据</button> <button class="btn soft" data-act="import">恢复备份</button><input id="backup" type="file" accept=".json" hidden></section><section class="card"><b>数据概况</b><div class="metric"><span>基金</span><b>'+d.funds.length+'</b></div><div class="metric"><span>定投计划</span><b>'+d.plans.length+'</b></div><p class="muted">快照和交易流水应分开保存，可信历史数据补齐后才能准确计算风险和回测。</p></section>';
bind()}
function bind(){document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{p=b.dataset.go;draw()});document.querySelectorAll("[data-act]").forEach(b=>b.onclick=()=>act(b.dataset.act));document.querySelectorAll("[data-toggle]").forEach(b=>b.onclick=()=>{d.plans[b.dataset.toggle].active=!d.plans[b.dataset.toggle].active;save();draw()})}
function act(a){if(a==="ocr")return alert("截图 OCR 尚未接入，请将截图信息核对后手动录入。");if(a==="fund")return fundForm();if(a==="plan")return planForm();if(a==="export"){let x=document.createElement("a");x.href=URL.createObjectURL(new Blob([JSON.stringify(d,null,2)],{type:"application/json"}));x.download="基金工作台备份.json";x.click();return}if(a==="import"){document.getElementById("backup").click();return}}
function fundForm(){document.getElementById("main").innerHTML='<section class="card"><b>录入基金持仓</b><form id="ff">'+input("基金名称","name","text",true)+input("基金代码","code","text")+input("持仓金额（元）","value","number",true)+input("今日收益（元）","day","number")+input("持有收益（元）","pnl","number")+input("数据日期","date","date")+'<button class="btn">保存</button> <button type="button" class="btn soft" id="back">返回</button></form></section>';document.getElementById("back").onclick=draw;document.getElementById("ff").onsubmit=e=>{e.preventDefault();d.funds.push(Object.fromEntries(new FormData(e.target)));save();p="持仓";draw()}}
function input(label,name,type,required){return '<div class="field"><label>'+label+'</label><input name="'+name+'" type="'+type+'" '+(required?"required":"")+' '+(name==="date"?'value="'+new Date().toISOString().slice(0,10)+'"':"")+'></div>'}
function planForm(){if(!d.funds.length)return alert("请先添加基金");document.getElementById("main").innerHTML='<section class="card"><b>新建定投计划</b><form id="pf"><div class="field"><label>选择基金</label><select name="fund">'+d.funds.map(f=>'<option>'+esc(f.name)+'</option>').join("")+'</select></div>'+input("每期金额","amount","number",true)+'<div class="field"><label>频率</label><select name="freq"><option>每周</option><option>每两周</option><option>每月</option></select></div>'+input("扣款日或星期","when","text",true)+'<div class="field"><label>分红方式</label><select name="dividend"><option>红利再投资（默认）</option><option>现金分红</option></select></div><button class="btn">保存计划</button> <button type="button" class="btn soft" id="back">返回</button></form></section>';document.getElementById("back").onclick=draw;document.getElementById("pf").onsubmit=e=>{e.preventDefault();d.plans.push({...Object.fromEntries(new FormData(e.target)),active:true});save();p="定投";draw()}}
document.addEventListener("change",async e=>{if(e.target.id!=="backup")return;try{let z=JSON.parse(await e.target.files[0].text());if(!Array.isArray(z.funds)||!Array.isArray(z.plans))throw 0;if(confirm("恢复备份将覆盖当前数据，继续？")){d=z;save();draw()}}catch{alert("备份文件无效")}e.target.value=""});document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{p=b.dataset.page;draw()});draw();
</script></body></html>
